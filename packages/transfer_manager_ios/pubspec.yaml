name: transfer_manager_ios
description: iOS background URLSession implementation for transfer_manager.
version: 2.0.0
homepage: https://github.com/pinzarulab/transfer_manager

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  transfer_manager: ^2.0.0
  transfer_manager_platform_interface: ^2.0.0

dependency_overrides:
  transfer_manager:
    path: ../..
  transfer_manager_platform_interface:
    path: ../transfer_manager_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TransferManagerIosPlugin
        dartPluginClass: TransferManagerIos
